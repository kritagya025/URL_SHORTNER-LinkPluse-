# ==============================================================================
# LinkPulse — Automated CI/CD Pipeline (GitHub Actions)
# ==============================================================================
# Purpose: Compile code, run JUnit 5 backend tests, validate frontend assets,
# build Docker container images, and publish tagged images to Docker Hub.
# ==============================================================================

name: LinkPulse CI/CD Pipeline

# ------------------------------------------------------------------------------
# 1. Triggers: Execute pipeline on push to main or pull requests
# ------------------------------------------------------------------------------
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ------------------------------------------------------------------------------
# 2. Jobs: Automated testing & container delivery jobs
# ------------------------------------------------------------------------------
jobs:

  # ============================================================================
  # JOB 1: Continuous Integration — Backend Build & Unit/Integration Tests
  # ============================================================================
  build-and-test-backend:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven & Run Unit Tests
        run: mvn clean test -B

  # ============================================================================
  # JOB 2: Continuous Integration — Frontend Assets & Nginx Config Validation
  # ============================================================================
  validate-frontend:
    name: Validate Frontend & Nginx Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Static Web Files
        run: |
          test -f frontend/index.html || (echo "Error: frontend/index.html missing" && exit 1)
          test -f frontend/css/style.css || (echo "Error: frontend/css/style.css missing" && exit 1)
          test -f frontend/js/app.js || (echo "Error: frontend/js/app.js missing" && exit 1)
          test -f frontend/nginx.conf || (echo "Error: frontend/nginx.conf missing" && exit 1)
          echo "All frontend static files and Nginx configs verified successfully."

      - name: Validate Frontend Nginx Docker Build
        run: docker build -t test-frontend ./frontend

  # ============================================================================
  # JOB 3: Continuous Delivery — Build & Publish Docker Images to Docker Hub
  # ============================================================================
  publish-docker-hub:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, validate-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub if secret credentials are configured
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Spring Boot Backend image (or build only if secrets omitted)
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'kritagya025' }}/url-shortener-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'kritagya025' }}/url-shortener-backend:${{ github.sha }}

      # Build and push Nginx Frontend image (or build only if secrets omitted)
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'kritagya025' }}/url-shortener-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'kritagya025' }}/url-shortener-frontend:${{ github.sha }}

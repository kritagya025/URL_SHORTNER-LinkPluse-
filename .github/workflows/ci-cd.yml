name: LinkPulse CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================================
  # JOB 1: Continuous Integration — Backend Build & Unit/Integration Tests
  # ============================================================================
  build-and-test-backend:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: url_shortener_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven & Run Unit Tests
        run: mvn clean verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: url_shortener_db
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  # ============================================================================
  # JOB 2: Continuous Integration — Frontend Assets & Nginx Config Validation
  # ============================================================================
  validate-frontend:
    name: Validate Frontend & Nginx Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Static Web Files
        run: |
          test -f frontend/index.html || (echo "Error: frontend/index.html missing" && exit 1)
          test -f frontend/css/style.css || (echo "Error: frontend/css/style.css missing" && exit 1)
          test -f frontend/js/app.js || (echo "Error: frontend/js/app.js missing" && exit 1)
          test -f frontend/nginx.conf || (echo "Error: frontend/nginx.conf missing" && exit 1)
          echo "All frontend static files and Nginx configs verified successfully."

      - name: Validate Frontend Nginx Docker Build
        run: docker build -t test-frontend ./frontend

  # ============================================================================
  # JOB 3: Continuous Delivery — Build & Push Docker Images to Docker Hub
  # ============================================================================
  build-docker-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, validate-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/linkpulse-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/linkpulse-backend:${{ github.sha }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/linkpulse-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/linkpulse-frontend:${{ github.sha }}

      - name: Trigger Render Backend Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render CD Deployment..."
            curl -s "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK secret is not configured. Skipping deploy hook trigger."
          fi


# ==============================================================================
# LinkPulse — Automated CI/CD Pipeline (GitHub Actions)
# ==============================================================================
# Purpose: Compile code, run JUnit 5 backend tests, validate frontend assets,
# build Docker container images, and publish tagged images to Docker Hub.
# ==============================================================================

name: LinkPulse CI/CD Pipeline

# ------------------------------------------------------------------------------
# 1. Triggers: When should this workflow execute?
# ------------------------------------------------------------------------------
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ------------------------------------------------------------------------------
# 2. Jobs: Parallel or sequential execution blocks
# ------------------------------------------------------------------------------
jobs:

  # ============================================================================
  # JOB 1: Continuous Integration — Backend Build & Unit/Integration Tests
  # ============================================================================
  build-and-test-backend:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1.1: Download repository source code onto the GitHub Actions runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 1.2: Set up Java 17 JDK with Maven dependency caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 1.3: Compile Java source code and run all JUnit 5 tests
      - name: Build with Maven & Run Unit Tests
        run: mvn clean test -B

  # ============================================================================
  # JOB 2: Continuous Integration — Frontend Assets & Nginx Config Validation
  # ============================================================================
  validate-frontend:
    name: Validate Frontend & Nginx Setup
    runs-on: ubuntu-latest

    steps:
      # Step 2.1: Checkout repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2.2: Verify required static web files exist
      - name: Check Static Web Files
        run: |
          test -f frontend/index.html || (echo "Error: frontend/index.html missing" && exit 1)
          test -f frontend/css/style.css || (echo "Error: frontend/css/style.css missing" && exit 1)
          test -f frontend/js/app.js || (echo "Error: frontend/js/app.js missing" && exit 1)
          test -f frontend/nginx.conf || (echo "Error: frontend/nginx.conf missing" && exit 1)
          echo "All frontend static files and Nginx configs verified successfully."

      # Step 2.3: Test build of Nginx Docker image
      - name: Validate Frontend Nginx Docker Build
        run: docker build -t test-frontend ./frontend

  # ============================================================================
  # JOB 3: Continuous Delivery — Build & Publish Docker Images to Docker Hub
  # ============================================================================
  # Safety Rule: This job ONLY runs if BOTH Job 1 and Job 2 succeeded,
  # AND if the commit was pushed to the main branch.
  publish-docker-hub:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, validate-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 3.1: Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 3.2: Set up Docker Buildx for enhanced container building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3.3: Authenticate with Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3.4: Build and push Spring Boot Backend image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-backend:${{ github.sha }}

      # Step 3.5: Build and push Nginx Frontend image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-frontend:${{ github.sha }}

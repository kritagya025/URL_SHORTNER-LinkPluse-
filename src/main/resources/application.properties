# Application Server Configuration
# PORT env var is used by Render; defaults to 8080 for local/Docker
server.port=${PORT:8080}

# Database Configuration (PostgreSQL with Environment Variable Overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortener_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:kritagya}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Custom Application Properties
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Spring Boot DevTools & Hot Reloading (Disabled by default in production docker builds)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.web.resources.cache.period=0
